# Deploy this repo to Azure App Service (Linux) as a ZIP.
#
# Production site (live): https://epreporting.azurewebsites.net/
# The ZIP is exactly what Git tracks after checkout — commit and push every file the app needs
# (Python, templates, shared assets, startup, requirements, committed DBs per .gitignore). Do not
# rely on unpushed local-only files. Backup branches and backup artifacts are excluded from deploy
# triggers and from the package (see rsync excludes below).
#
# Setup (one-time in GitHub):
#   1. Azure Portal → your Web App → Download publish profile
#   2. Repo → Settings → Secrets and variables → Actions
#   3. New repository secret: AZURE_WEBAPP_PUBLISH_PROFILE = entire .PublishSettings XML
#
# Databases: see root .gitignore — smaller DBs (e.g. epics_management.db, jira_exports.db) may be
# committed; large/cache DBs stay gitignored. assignee_hours_capacity.db is typically uploaded once
# via Kudu if not in Git. jira_sync_cache.db rebuilds on the server from Jira.
#
# NOTE: package.json and package-lock.json are intentionally excluded from the deploy ZIP.
# They are local-dev/Playwright tooling only. Including them causes Oryx to detect Node.js
# alongside Python, which can make Oryx generate a Node.js startup command instead of using
# the Python gunicorn startup, crashing the container at runtime (exit code 1).
#
# Optional: change AZURE_WEBAPP_NAME below if your app name differs.

name: Azure App Service deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  AZURE_WEBAPP_NAME: epreporting

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # App Service runs Python 3.11. Binary wheels are ABI-specific, so vendoring with any
      # other runner Python ships e.g. _imaging.cpython-312-*.so, which 3.11 cannot import.
      - name: Use the App Service Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage files (match local packaging exclusions)
        run: |
          set -e
          mkdir -p staging
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='.pytest_cache/' \
            --exclude='__pycache__/' \
            --exclude='node_modules/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='tests/' \
            --exclude='test-results/' \
            --exclude='handover/' \
            --exclude='offline_bundles/' \
            --exclude='backup/' \
            --exclude='.cursor/' \
            --exclude='.azure_deploy_staging/' \
            --exclude='.env' \
            --exclude='server.stdout.log' \
            --exclude='server.stderr.log' \
            --exclude='server.verify.stdout.log' \
            --exclude='server.verify.stderr.log' \
            ./ staging/

      - name: Vendor Python packages for zip deploy
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --target staging/.python_packages/lib/site-packages --only-binary=:all:
          chmod +x staging/startup.txt

      - name: Verify required startup files
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          staging = Path("staging")
          site_packages = staging / ".python_packages/lib/site-packages"

          required = [
              "startup.txt",
              "wsgi.py",
              "report_server.py",
              "db_journal_mode.py",
              "requirements.txt",
              ".python_packages/lib/site-packages/gunicorn",
              ".python_packages/lib/site-packages/PIL",
          ]
          missing = [path for path in required if not (staging / path).exists()]
          if missing:
              raise SystemExit("Missing required deploy files: " + ", ".join(missing))

          # A PIL directory is not enough: the compiled extension must match the App Service
          # interpreter, otherwise every upload fails with "cannot import name '_imaging'".
          imaging = sorted((site_packages / "PIL").glob("_imaging.cpython-311-*.so"))
          if not imaging:
              found = sorted(p.name for p in (site_packages / "PIL").glob("_imaging*.so"))
              raise SystemExit(
                  "Pillow was vendored without a CPython 3.11 _imaging extension. "
                  f"Found: {found or 'nothing'}"
              )
          PY

      - name: Create ZIP
        run: |
          set -e
          (cd staging && zip -rq ../deploy.zip .)

      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip

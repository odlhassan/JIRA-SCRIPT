<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Capacity &amp; Utilization</title><link rel="stylesheet" href="/shared-nav.css">
<style>
#teams.team-options{width:min(360px,calc(100vw - 32px));padding:8px;scrollbar-width:thin;scrollbar-color:#9db3cc transparent}#teams .team-actions{position:sticky;top:-8px;z-index:2;display:flex;gap:6px;padding:8px 4px 10px;background:var(--surface);border-bottom:1px solid var(--line)}#teams .team-actions button{min-height:30px;padding:5px 10px;border:1px solid #c9d9eb;border-radius:8px;background:#f5f9ff;color:var(--brand);font-size:12px;font-weight:750;cursor:pointer}#teams .team-actions button:hover{border-color:#8bb8e8;background:var(--brand-soft)}#teams .team-option{position:relative;display:grid!important;grid-template-columns:20px minmax(0,1fr);align-items:center;gap:10px;min-height:42px;margin:2px 0;padding:8px 10px!important;border:1px solid transparent;border-radius:9px;cursor:pointer}#teams .team-option:hover{border-color:#c7dcf3;background:var(--brand-soft)}#teams .team-option:has(input:checked){background:#f1f7ff}#teams .team-option input[type=checkbox]{position:static!important;display:block!important;flex:none!important;width:17px!important;min-width:17px!important;max-width:17px!important;height:17px!important;min-height:17px!important;max-height:17px!important;margin:0!important;padding:0!important;border:1px solid #91a8c2!important;border-radius:4px!important;opacity:1!important;appearance:auto!important;accent-color:var(--brand)}#teams .team-option span{display:block;min-width:0;overflow:hidden;color:var(--ink);line-height:1.3;text-overflow:ellipsis;white-space:nowrap}.team-picker[open] summary::after{transform:rotate(180deg)}
:root{--page:#f3f7fc;--surface:#fff;--surface-2:#f7faff;--line:#d8e4f2;--ink:#14243b;--muted:#60738d;--brand:#1769c2;--brand-soft:#eaf4ff;--support:#087f8c;--danger:#b42318;--shadow:0 8px 28px rgba(21,50,88,.08)}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px "Segoe UI",Arial,sans-serif}.wrap{max-width:1880px;margin:auto;padding:30px 28px 54px}.head{margin-bottom:18px}.head h1{font-size:26px;line-height:1.2;margin:0}.head p{margin:7px 0 0;color:var(--muted)}.filters{display:grid;grid-template-columns:minmax(155px,.75fr) minmax(190px,1fr) minmax(230px,1.2fr) minmax(205px,1fr) auto auto;gap:14px;align-items:end;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}.field{display:grid;gap:7px}.field>span{color:#526780;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.field select,.field input,.team-picker summary{height:42px;width:100%;border:1px solid #bfd0e5;border-radius:10px;background:var(--surface-2);color:var(--ink);padding:0 12px;font:600 14px "Segoe UI",sans-serif;outline:none}.field select:focus,.field input:focus,.team-picker[open] summary{border-color:var(--brand);box-shadow:0 0 0 3px rgba(23,105,194,.12)}.teams{position:relative}.team-picker summary{display:flex;align-items:center;justify-content:space-between;list-style:none;cursor:pointer}.team-picker summary::after{content:"⌄";font-size:18px;color:var(--brand)}.team-picker summary::-webkit-details-marker{display:none}.team-options{position:absolute;z-index:20;top:70px;left:0;width:min(330px,90vw);max-height:320px;overflow:auto;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 42px rgba(21,50,88,.2)}.team-actions{display:flex;gap:8px;padding:4px 5px 8px;border-bottom:1px solid var(--line)}.team-actions button{border:0;background:transparent;color:var(--brand);font-weight:700;cursor:pointer}.team-option{display:flex;align-items:center;gap:10px;padding:9px 7px;border-radius:8px;color:var(--ink);font-weight:600}.team-option:hover{background:var(--brand-soft)}.switch{display:flex;align-items:center;gap:10px;height:42px;white-space:nowrap;font-weight:700;color:#344963}.switch input{position:absolute;opacity:0}.track{width:42px;height:24px;padding:3px;border-radius:99px;background:#aebed0;transition:.18s}.track::after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #60738d;transition:.18s}.switch input:checked+.track{background:var(--brand)}.switch input:checked+.track::after{transform:translateX(18px)}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 2px 10px;color:var(--muted);font-size:12px}.status.error{color:var(--danger);font-weight:700}.table-wrap{border:1px solid var(--line);border-radius:16px;overflow:auto;background:var(--surface);box-shadow:var(--shadow);max-height:calc(100vh - 250px)}table{width:100%;min-width:1160px;border-collapse:separate;border-spacing:0}thead{position:sticky;top:0;z-index:5}th{background:#153d6c;color:#fff;font-size:11px;letter-spacing:.055em;text-transform:uppercase;text-align:left}th,td{padding:13px 14px;border-bottom:1px solid var(--line)}tbody tr:nth-child(even):not(.total){background:#f8fbff}tbody tr:hover:not(.total){background:#edf6ff}td.num{text-align:right;font-variant-numeric:tabular-nums}.employee{font-weight:650}.support{display:inline-flex;margin-left:8px;padding:2px 8px;border-radius:99px;background:#e7f8fa;border:1px solid #8bd4db;color:var(--support);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}.total td{position:sticky;bottom:0;font-weight:900;background:#e5f1ff;border-top:2px solid var(--brand);border-bottom:0}.empty{padding:42px;text-align:center;color:var(--muted)}.loading{display:inline-flex;align-items:center;gap:8px}.loading::before{content:"";width:13px;height:13px;border:2px solid #b9cbe0;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1200px){.filters{grid-template-columns:repeat(3,minmax(180px,1fr))}}@media(max-width:720px){.wrap{padding:18px 12px}.filters{grid-template-columns:1fr}.table-wrap{max-height:none}.meta{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="head"><h1>Employee Capacity &amp; Utilization</h1><p>Canonical Jira worklogs, capacity, leave, and assigned estimates for every employee.</p></header><section class="filters" aria-label="Report filters"><label class="field"><span>Month</span><input id="month" type="month"></label><label class="field"><span>Capacity profile</span><select id="profile"></select></label><div class="field teams"><span>Teams</span><details class="team-picker"><summary id="team-summary">All teams except Process Team</summary><div id="teams" class="team-options"></div></details></div><label class="field"><span>Logged hours</span><select id="scope"><option value="any">Any employee worklog</option><option value="assigned">Only assigned subtasks</option></select></label><label class="switch"><input id="resigned" type="checkbox"><span class="track"></span><span>Display resigned</span></label><label class="switch"><input id="support" type="checkbox" checked><span class="track"></span><span>Indicate support</span></label></section><div class="meta"><span id="status" class="status">Loading canonical data…</span><span id="snapshot"></span></div><section class="table-wrap"><div id="table"><div class="empty"><span class="loading">Loading employees</span></div></div></section></main><script>
let data={},issues=[],logs=[],leaves=[],teams=[],profiles=[],support=new Set(),resources={};
const n=x=>Number(x||0),txt=x=>String(x||""),key=x=>txt(x).trim().toLowerCase(),esc=x=>txt(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const month=document.querySelector('#month'),profile=document.querySelector('#profile'),team=document.querySelector('#teams'),teamSummary=document.querySelector('#team-summary'),scope=document.querySelector('#scope'),resigned=document.querySelector('#resigned'),supportToggle=document.querySelector('#support'),table=document.querySelector('#table'),statusEl=document.querySelector('#status'),snapshot=document.querySelector('#snapshot');
document.addEventListener('click',event=>{const picker=document.querySelector('.team-picker');if(picker?.open&&!event.target.closest('.team-picker'))picker.removeAttribute('open')});document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelector('.team-picker')?.removeAttribute('open')});
const now=new Date();month.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
function hydrate(next){data=next||{};issues=data.issues||[];logs=data.worklogs||[];leaves=data.leaves||[];teams=data.teams||[];profiles=data.profiles||[];support=new Set((data.support||[]).map(key));resources=data.resources||{};profile.innerHTML='<option value="">Auto profile</option>'+profiles.map((p,i)=>`<option value="${i}">${esc(p.from_date)} – ${esc(p.to_date)}</option>`).join('');team.innerHTML='<div class="team-actions"><button type="button" data-team-action="all">Select all</button><button type="button" data-team-action="default">Reset default</button></div>'+teams.map(t=>`<label class="team-option"><input type="checkbox" value="${esc(t.team_name)}" ${key(t.team_name)==='process team'?'':'checked'}><span>${esc(t.team_name)}</span></label>`).join('');updateTeamSummary();render();}
function updateTeamSummary(){const boxes=[...team.querySelectorAll('input[type=checkbox]')],selected=boxes.filter(x=>x.checked);if(!boxes.length)teamSummary.textContent='All employees';else if(selected.length===boxes.length)teamSummary.textContent='All teams';else if(selected.length===boxes.length-1&&boxes.some(x=>!x.checked&&key(x.value)==='process team'))teamSummary.textContent='All except Process Team';else teamSummary.textContent=`${selected.length} of ${boxes.length} teams`;}
function activeProfile(){const m=month.value+'-01',selected=profile.value;if(selected!=='')return profiles[n(selected)]||{};return profiles.find(p=>txt(p.from_date)<=m&&txt(p.to_date)>=m)||profiles[0]||{}}
function days(){const [y,m]=month.value.split('-').map(Number);return {from:`${y}-${String(m).padStart(2,'0')}-01`,to:`${y}-${String(m).padStart(2,'0')}-${new Date(y,m,0).getDate()}`}}
function capacity(p,r){let h=0,d=new Date(r.from+'T00:00:00'),e=new Date(r.to+'T00:00:00'),hol=new Set(p.holiday_dates||[]);for(;d<=e;d.setDate(d.getDate()+1)){let iso=d.toISOString().slice(0,10);if(d.getDay()&&d.getDay()<6&&!hol.has(iso))h+=txt(p.ramadan_start_date)&&txt(p.ramadan_start_date)<=iso&&iso<=txt(p.ramadan_end_date)?n(p.ramadan_hours_per_day):n(p.standard_hours_per_day||8)}return h}
function overlap(a,b,r){return txt(a)&&txt(b)&&txt(a)<=r.to&&txt(b)>=r.from}
function teamAllows(nk){const memberships=teams.filter(t=>(t.assignees||[]).some(name=>key(name)===nk));return !memberships.length||memberships.some(t=>team.querySelector(`input[value="${CSS.escape(t.team_name)}"]`)?.checked)}
function render(){if(!month.value)return;const r=days(),p=activeProfile(),names=new Set([...Object.keys(resources),...issues.map(x=>x.assignee),...logs.map(x=>x.worklog_author||x.issue_assignee),...leaves.map(x=>x.assignee)].map(key));let rows=[];for(const nk of names){if(!nk||!teamAllows(nk))continue;let resourceKey=Object.keys(resources).find(x=>key(x)===nk),label=resourceKey||issues.find(x=>key(x.assignee)===nk)?.assignee||logs.find(x=>key(x.worklog_author||x.issue_assignee)===nk)?.worklog_author||leaves.find(x=>key(x.assignee)===nk)?.assignee||'';if(!resigned.checked&&resources[resourceKey]?.resigned)continue;let bookedRows=issues.filter(x=>key(x.assignee)===nk&&/sub-?task/i.test(txt(x.issue_type))&&!txt(x.issue_key).startsWith('RLT-')&&overlap(x.start_date,x.due_date,r));let logRows=logs.filter(x=>key(x.worklog_author||x.issue_assignee)===nk&&txt(x.worklog_date)>=r.from&&txt(x.worklog_date)<=r.to&&(scope.value==='any'||(key(x.item_assignee)===nk&&/sub-?task/i.test(txt(x.item_issue_type)))));let leaveRows=leaves.filter(x=>key(x.assignee)===nk&&txt(x.period_day)>=r.from&&txt(x.period_day)<=r.to);let cap=capacity(p,r),taken=leaveRows.reduce((s,x)=>s+n(x.planned_taken_hours)+n(x.unplanned_taken_hours),0),booked=bookedRows.reduce((s,x)=>s+n(x.original_estimate_hours),0),logged=logRows.reduce((s,x)=>s+n(x.hours_logged),0),available=Math.max(0,cap-taken);rows.push({label,cap,taken,available,booked,logged,util:available?logged/available*100:0})}rows.sort((a,b)=>a.label.localeCompare(b.label));let official=(p.holiday_dates||[]).filter(x=>x>=r.from&&x<=r.to).length,total=rows.reduce((a,x)=>({cap:a.cap+x.cap,taken:a.taken+x.taken,available:a.available+x.available,booked:a.booked+x.booked,logged:a.logged+x.logged}),{cap:0,taken:0,available:0,booked:0,logged:0});total.label='Grand Total';total.util=total.available?total.logged/total.available*100:0;const line=(x,c='')=>`<tr class="${c}"><td class="employee">${esc(x.label)}${supportToggle.checked&&x.label!=='Grand Total'&&support.has(key(x.label))?'<span class="support">Support</span>':''}</td><td class="num">${x.cap.toFixed(2)}h</td><td class="num">${c?official*rows.length:official} days</td><td class="num">${x.taken.toFixed(2)}h</td><td class="num">${x.available.toFixed(2)}h</td><td class="num">${x.booked.toFixed(2)}h</td><td class="num">${x.logged.toFixed(2)}h</td><td class="num">${x.util.toFixed(1)}%</td></tr>`;table.innerHTML=rows.length?`<table><thead><tr><th>Employee Name</th><th>Capacity (Hours)</th><th>Official Leaves</th><th>Leaves Taken</th><th>Availability</th><th>Booked Manhours</th><th>Logged Hours</th><th>Utilization</th></tr></thead><tbody>${rows.map(x=>line(x)).join('')}${line(total,'total')}</tbody></table>`:'<div class="empty">No employees match the selected filters.</div>';statusEl.textContent=`${rows.length} employees · filters apply automatically`;statusEl.className='status';snapshot.textContent=data.generated_at?`Canonical snapshot ${data.canonical_run_id||''} · ${new Date(data.generated_at).toLocaleString()}`:'';}
async function loadCanonical(){statusEl.textContent='Loading canonical data…';statusEl.className='status';table.innerHTML='<div class="empty"><span class="loading">Loading employees</span></div>';try{const response=await fetch('/api/employee-capacity-utilization/data',{cache:'no-store'}),body=await response.json();if(!response.ok||body.error)throw new Error(body.error||`Request failed (${response.status})`);hydrate(body)}catch(error){statusEl.textContent=`Could not load canonical data: ${error.message||error}`;statusEl.className='status error';snapshot.textContent='';table.innerHTML='<div class="empty">Canonical worklogs could not be loaded. No zero-hour fallback has been shown.</div>'}}
for(const el of[profile,scope,resigned,supportToggle])el.addEventListener('change',render);month.addEventListener('change',render);team.addEventListener('change',()=>{updateTeamSummary();render()});team.addEventListener('click',event=>{const action=event.target?.dataset?.teamAction;if(!action)return;for(const box of team.querySelectorAll('input[type=checkbox]'))box.checked=action==='all'||key(box.value)!=='process team';updateTeamSummary();render()});loadCanonical();
</script><script src="/shared-nav.js"></script></body></html>
